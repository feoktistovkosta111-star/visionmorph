<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Атма — путь к себе</title>
<style>
  @property --pct{
    syntax:'<number>';
    inherits:false;
    initial-value:0;
  }
  :root{
    --bg-0:#f8f4ec;
    --bg-1:#efe4d1;
    --bg-2:#e7dcc8;
    --ink:#201d19;
    --ink-soft:rgba(32,29,25,0.62);
    --ink-faint:rgba(32,29,25,0.36);
    --card-solid:#fbf8f2;
    --glass-strong:rgba(255,255,255,0.68);
    --line:rgba(32,29,25,0.08);
    --c-coral:#ff8a65;
    --c-gold:#f2b84b;
    --c-violet:#8a7ff0;
    --c-rose:#ef8fae;
    --c-sage:#6fa06f;
    --shadow-card:0 10px 26px rgba(32,29,25,0.08);
    --shadow-glow:0 26px 60px -14px rgba(138,127,240,0.32), 0 8px 22px rgba(32,29,25,0.07);
    --grain-tex:none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,'SF Pro Display','Segoe UI Variable','Segoe UI',system-ui,sans-serif;
    background:linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 0;
  }
  h1,h2,h3{font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;text-wrap:balance;}
  p{line-height:1.5;}
  .app-shell{
    width:430px;
    max-width:100vw;
    height:900px;
    max-height:96vh;
    position:relative;
    background:var(--card-solid);
    border-radius:44px;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 30px 70px rgba(32,29,25,0.22), inset 0 0 0 6px rgba(255,255,255,0.4);
    overflow:hidden;
  }
  @media (max-width:460px){
    body{padding:0;}
    .app-shell{width:100vw;height:100vh;max-height:100vh;border-radius:0;border:none;box-shadow:none;}
  }
  .screens{position:absolute;inset:0;bottom:100px;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transform:translateY(6px);}
  .screen.active{display:flex;}
  @media (prefers-reduced-motion: no-preference){
    .screen.screen-enter{opacity:1;transform:translateY(0);transition:opacity .3s ease, transform .3s ease;}
  }
  @media (prefers-reduced-motion: reduce){
    .screen{opacity:1;transform:none;}
  }
  .header{
    display:flex;align-items:center;gap:10px;
    padding:22px 20px 14px;
    flex-shrink:0;
  }
  .header h1{font-size:19px;margin:0;color:var(--ink);}
  .back-btn{
    background:var(--card-solid);border:1px solid var(--line);color:var(--ink);
    width:36px;height:36px;border-radius:50%;cursor:pointer;flex-shrink:0;
    box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;
  }
  .scroll-area{flex:1;overflow-y:auto;padding:6px 20px 30px;-webkit-overflow-scrolling:touch;}
  .scroll-area::-webkit-scrollbar{width:4px;}
  .scroll-area::-webkit-scrollbar-thumb{background:rgba(32,29,25,0.15);border-radius:4px;}

  /* film-grain overlay, shared texture generated once via canvas at load time */
  .grain{position:absolute;inset:0;background-image:var(--grain-tex);background-size:96px 96px;opacity:0.05;mix-blend-mode:overlay;pointer-events:none;}

  /* hero mesh scenes + overlapping sheet */
  .hero-scene{position:relative;overflow:hidden;flex-shrink:0;height:230px;}
  .hero-scene.tall{height:280px;}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 32%,rgba(255,255,255,0.55) 100%);pointer-events:none;}
  .hero-overlay-text{position:absolute;left:22px;right:22px;bottom:20px;color:var(--ink);}
  .hero-logo{font-size:14px;font-weight:800;letter-spacing:0.02em;margin-bottom:6px;opacity:0.85;}
  .hero-overlay-text h2{font-size:25px;margin:0;letter-spacing:-0.02em;}
  .floating-btn{
    position:absolute;z-index:5;background:rgba(255,255,255,0.78);backdrop-filter:blur(12px) saturate(160%);
    border:1px solid rgba(255,255,255,0.75);color:var(--ink);width:40px;height:40px;border-radius:50%;
    box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .back-float{top:18px;left:18px;}
  .floating-badge{
    position:absolute;top:18px;right:18px;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);
    color:var(--ink);font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:20px;
    box-shadow:var(--shadow-card);z-index:5;font-variant-numeric:tabular-nums;
  }
  .sheet{
    background:var(--card-solid);border-radius:32px 32px 0 0;margin-top:-26px;position:relative;z-index:2;
    box-shadow:0 -16px 34px rgba(32,29,25,0.06);padding:26px 20px 24px;flex:1;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .meta-line{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}

  /* mesh-gradient scene recipes: layered radial blobs read as painterly photography stand-ins */
  .scene-sunrise{background:
    radial-gradient(60% 55% at 22% 20%, #ffdf9a 0%, transparent 60%),
    radial-gradient(70% 60% at 82% 30%, #ff9d78 0%, transparent 65%),
    radial-gradient(85% 70% at 50% 100%, #ff7f92 0%, transparent 60%),
    linear-gradient(160deg,#ffe9b8,#ffb49e 60%,#f28ba0 100%);}
  .scene-night{background:
    radial-gradient(circle at 22% 20%, rgba(255,255,255,0.55) 0 1.4px, transparent 1.4px),
    radial-gradient(circle at 68% 12%, rgba(255,255,255,0.4) 0 1px, transparent 1px),
    radial-gradient(circle at 82% 42%, rgba(255,255,255,0.5) 0 1.4px, transparent 1.4px),
    radial-gradient(60% 50% at 78% 22%, #f6ecd0 0%, transparent 40%),
    radial-gradient(60% 55% at 18% 20%, #7873c9 0%, transparent 60%),
    radial-gradient(75% 65% at 50% 100%, #c2a9dd 0%, transparent 60%),
    linear-gradient(170deg,#605ea3,#8b83c9 55%,#c6b6d9 100%);
    background-size:70px 70px,90px 90px,60px 60px,cover,cover,cover,cover;}
  .scene-water{background:
    radial-gradient(60% 50% at 25% 18%, #d3f2e6 0%, transparent 60%),
    radial-gradient(70% 60% at 82% 40%, #6fc7cb 0%, transparent 65%),
    radial-gradient(85% 70% at 50% 100%, #357e93 0%, transparent 60%),
    linear-gradient(170deg,#daf1e6,#7fc3c9 60%,#357e93 100%);}
  .scene-mist{background:
    radial-gradient(60% 50% at 22% 15%, #eef4de 0%, transparent 58%),
    radial-gradient(70% 55% at 82% 32%, #b6c79f 0%, transparent 60%),
    radial-gradient(80% 65% at 50% 100%, #59684a 0%, transparent 60%),
    linear-gradient(170deg,#e7ecdc,#a9b894 55%,#5e6d4c 100%);}
  .scene-mist::before{content:'';position:absolute;left:6%;bottom:-4%;width:24%;height:68%;background:rgba(38,46,30,0.32);clip-path:polygon(50% 0%,0% 100%,100% 100%);}
  .scene-mist::after{content:'';position:absolute;left:20%;bottom:6%;width:20%;height:52%;background:rgba(38,46,30,0.22);clip-path:polygon(50% 0%,0% 100%,100% 100%);}
  .scene-golden{background:
    radial-gradient(65% 55% at 50% 8%, #fff3c4 0%, transparent 55%),
    radial-gradient(80% 70% at 50% 100%, #e69f4c 0%, transparent 65%),
    repeating-conic-gradient(from 210deg at 50% 0%, rgba(255,255,255,0.16) 0 3deg, transparent 3deg 14deg),
    linear-gradient(170deg,#fff2c8,#f5c579 55%,#d99242 100%);}
  .scene-goldlight{background:
    radial-gradient(60% 55% at 28% 18%, #ffe6a8 0%, transparent 60%),
    radial-gradient(70% 60% at 82% 62%, #dd9c3e 0%, transparent 65%),
    linear-gradient(160deg,#f7deA0,#dda953 55%,#a9702e 100%);}
  .scene-bloom{background:
    radial-gradient(60% 50% at 24% 18%, #ffdde9 0%, transparent 60%),
    radial-gradient(70% 60% at 82% 42%, #ee9ec1 0%, transparent 65%),
    radial-gradient(80% 65% at 50% 100%, #b8698f 0%, transparent 60%),
    linear-gradient(160deg,#ffe3ee,#e79fc0 55%,#b8698f 100%);}
  .scene-rainbow{background:
    radial-gradient(55% 55% at 14% 22%, #ffb199 0%, transparent 55%),
    radial-gradient(55% 55% at 44% 12%, #ffe08a 0%, transparent 55%),
    radial-gradient(55% 55% at 76% 22%, #9be0b0 0%, transparent 55%),
    radial-gradient(55% 55% at 88% 58%, #8ecfe0 0%, transparent 55%),
    radial-gradient(60% 55% at 30% 78%, #a6a6ec 0%, transparent 58%),
    linear-gradient(150deg,#ffe6d2,#d9e8d0 40%,#cfe4ea 70%,#d9d4ef 100%);}
  .scene-cloud{background:
    radial-gradient(55% 45% at 25% 65%, #ffffff 0%, transparent 45%),
    radial-gradient(55% 45% at 72% 78%, #f4f7f5 0%, transparent 40%),
    radial-gradient(70% 60% at 50% 100%, #9fb0b4 0%, transparent 60%),
    linear-gradient(170deg,#eef1ee,#cdd6d8 55%,#93a3a7 100%);}
  .scene-forest{background:
    radial-gradient(60% 50% at 26% 14%, #dcE9c8 0%, transparent 55%),
    radial-gradient(70% 60% at 78% 34%, #9cb480 0%, transparent 60%),
    radial-gradient(80% 65% at 50% 100%, #445536 0%, transparent 60%),
    linear-gradient(170deg,#e2ead2,#8fa373 55%,#455636 100%);}
  .scene-forest::before{content:'';position:absolute;left:8%;bottom:-4%;width:22%;height:70%;background:rgba(28,36,20,0.35);clip-path:polygon(50% 0%,0% 100%,100% 100%);}
  .scene-forest::after{content:'';position:absolute;left:20%;bottom:6%;width:18%;height:55%;background:rgba(28,36,20,0.25);clip-path:polygon(50% 0%,0% 100%,100% 100%);}

  .hero-scene{position:relative;overflow:hidden;}
  .scene-thumb{position:relative;overflow:hidden;width:56px;height:56px;border-radius:18px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.5);}
  .thumb-badge{
    position:absolute;bottom:-3px;right:-3px;width:22px;height:22px;border-radius:50%;background:var(--card-solid);
    display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:var(--shadow-card);
  }

  /* signature circular progress ring — animates smoothly via @property */
  .ring-wrap{position:relative;width:168px;height:168px;margin:8px auto 18px;}
  .ring{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from -90deg, var(--c-violet) 0deg, var(--c-coral) calc(var(--pct) * 1.8deg), var(--c-gold) calc(var(--pct) * 3.6deg), rgba(32,29,25,0.07) calc(var(--pct) * 3.6deg) 360deg);
    transition:--pct .7s cubic-bezier(.16,.84,.44,1);
    box-shadow:0 0 26px -6px rgba(138,127,240,0.4);
  }
  .ring-inner{position:absolute;inset:15px;background:var(--card-solid);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(32,29,25,0.07);overflow:visible;}
  .ring-value{font-size:28px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ring-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;font-weight:700;}

  .stat-row{display:flex;justify-content:space-between;gap:6px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .stat-row .stat{text-align:center;flex:1;}
  .stat-row .stat b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:800;}
  .stat-row .stat span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}

  .card{
    background:var(--glass-strong);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,0.7);border-radius:26px;
    padding:18px;margin-bottom:16px;box-shadow:var(--shadow-card);
  }
  .glow-card{box-shadow:var(--shadow-glow);border:1px solid rgba(255,255,255,0.85);}
  .card-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--c-violet);margin-bottom:8px;font-weight:800;}
  .streak-line{color:var(--c-coral);font-size:13px;margin:0 0 10px;font-weight:700;}
  .big-affirmation{font-size:20px;font-style:italic;font-weight:500;color:var(--ink);margin:0;letter-spacing:-0.01em;}
  .intention-card{border:1px solid rgba(242,184,75,0.4);}

  /* bento layout for home */
  .bento-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
  .bento-wide{grid-column:1 / -1;}
  .bento-row-3{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .quick-tile{cursor:pointer;transition:transform .15s;}
  .quick-tile:active{transform:scale(0.97);}
  .quick-tile-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-top:10px;}
  .quick-small{
    background:var(--glass-strong);border:1px solid rgba(255,255,255,0.7);border-radius:22px;padding:14px 6px;
    text-align:center;cursor:pointer;box-shadow:var(--shadow-card);display:flex;flex-direction:column;
    align-items:center;gap:7px;transition:transform .15s;
  }
  .quick-small:active{transform:scale(0.96);}
  .quick-small span{font-size:11px;font-weight:700;color:var(--ink);}
  .quick-icon-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .quick-icon-circle svg{width:20px;height:20px;}
  .quick-small .quick-icon-circle{width:38px;height:38px;}
  .quick-small .quick-icon-circle svg{width:17px;height:17px;}

  @media (prefers-reduced-motion: no-preference){
    .bento{opacity:0;animation:fadeUp .5s ease forwards;}
    .bento:nth-child(1){animation-delay:.02s;}
    .bento:nth-child(2){animation-delay:.07s;}
    .bento:nth-child(3){animation-delay:.12s;}
    .bento:nth-child(4){animation-delay:.16s;}
    .bento:nth-child(5){animation-delay:.2s;}
    .bento:nth-child(6){animation-delay:.24s;}
    .bento:nth-child(7){animation-delay:.28s;}
    .bento:nth-child(8){animation-delay:.32s;}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .list-card{
    display:flex;align-items:center;gap:14px;background:var(--glass-strong);border:1px solid rgba(255,255,255,0.7);
    border-radius:22px;padding:12px 14px;margin-bottom:12px;cursor:pointer;transition:transform .15s;
    box-shadow:var(--shadow-card);
  }
  .list-card:active{transform:scale(0.98);}
  .list-info{flex:1;min-width:0;}
  .list-title{font-size:15px;font-weight:700;margin:0 0 3px;color:var(--ink);letter-spacing:-0.01em;}
  .list-sub{font-size:12.5px;color:var(--ink-soft);margin:0;}
  .list-arrow{color:var(--ink-faint);font-size:16px;}

  .section-sub{font-size:12px;color:var(--c-violet);margin:22px 0 10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:800;}

  .btn{
    display:block;width:100%;padding:14px;border-radius:18px;border:none;font-size:15px;font-weight:700;
    cursor:pointer;margin-top:10px;text-align:center;transition:transform .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(120deg,var(--c-coral),var(--c-gold));color:#2c1a0f;box-shadow:0 14px 30px -8px rgba(255,138,101,0.5), inset 0 1px 0 rgba(255,255,255,0.5);}
  .btn-outline{background:rgba(255,255,255,0.5);border:1px solid var(--line);color:var(--ink);}
  .link-btn{background:none;border:none;color:var(--c-violet);font-size:13px;cursor:pointer;padding:6px 0;font-weight:700;}
  .center-link{display:block;margin:6px auto 0;}

  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .chip{
    background:rgba(255,255,255,0.5);border:1px solid var(--line);color:var(--ink);
    padding:9px 14px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600;transition:transform .15s;
  }
  .chip:active{transform:scale(0.96);}
  .chip-active{background:linear-gradient(120deg,var(--c-coral),var(--c-gold));color:#2c1a0f;border-color:transparent;}

  .affirm-card{
    background:linear-gradient(160deg, rgba(255,255,255,0.78), rgba(255,205,190,0.35));
    border:1px solid rgba(255,255,255,0.85);border-radius:26px;padding:34px 20px;text-align:center;margin:14px 0;
    min-height:120px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-glow);
  }
  .affirm-card p{font-size:20px;font-style:italic;font-weight:500;color:var(--ink);letter-spacing:-0.01em;}
  .affirm-actions{display:flex;gap:10px;}
  .icon-btn{
    background:var(--card-solid);border:1px solid var(--line);color:var(--ink);
    width:52px;height:52px;border-radius:18px;font-size:20px;cursor:pointer;flex-shrink:0;
  }
  .icon-btn.fav-active{color:var(--c-rose);border-color:var(--c-rose);}
  .affirm-list-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--card-solid);border:1px solid var(--line);border-radius:16px;
    padding:12px 14px;margin-bottom:10px;font-size:13.5px;color:var(--ink);
  }
  .affirm-list-item button{background:none;border:none;font-size:17px;cursor:pointer;color:var(--ink-faint);}
  .affirm-list-item button.fav-active{color:var(--c-rose);}

  .med-timer{font-size:26px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);font-variant-numeric:tabular-nums;}
  .med-play-btn{
    width:56px;height:56px;border-radius:50%;border:none;
    background:linear-gradient(120deg,var(--c-coral),var(--c-gold));font-size:20px;cursor:pointer;
    box-shadow:0 12px 26px -6px rgba(255,138,101,0.5);margin-bottom:8px;transition:transform .15s;
  }
  .med-play-btn:active{transform:scale(0.94);}
  .med-play-btn.standalone{display:block;margin:4px auto 4px;}
  .step-card p{margin:0;font-size:15px;color:var(--ink);text-align:center;min-height:44px;}

  .breath-phase-label{font-size:19px;color:var(--c-violet);margin-bottom:6px;letter-spacing:0.01em;text-align:center;font-weight:800;}
  .breath-circle{
    width:100px;height:100px;border-radius:50%;
    background:radial-gradient(circle, rgba(138,127,240,0.5), rgba(138,127,240,0.06));
    border:1px solid rgba(138,127,240,0.45);
    transition:transform 1s linear;
  }
  .rounds-select{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}

  .practice-desc{color:var(--ink-soft);font-size:14px;margin-bottom:16px;}
  .steps-list{padding-left:20px;margin:0 0 16px;}
  .steps-list li{margin-bottom:10px;font-size:14.5px;line-height:1.5;color:var(--ink);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--c-violet);margin-bottom:6px;font-weight:700;}
  .field textarea, .field input[type=text]{
    width:100%;background:rgba(255,255,255,0.55);border:1px solid var(--line);border-radius:14px;
    color:var(--ink);padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;min-height:44px;
  }
  .field textarea{min-height:70px;}

  .challenge-grid{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .challenge-item{
    display:flex;align-items:center;gap:10px;background:var(--card-solid);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;cursor:pointer;font-size:13px;
  }
  .challenge-item.done{border-color:var(--c-sage);background:rgba(111,160,111,0.12);}
  .day-num{color:var(--c-violet);font-weight:800;flex-shrink:0;width:60px;}
  .day-task{flex:1;color:var(--ink);}
  .check{color:var(--c-sage);font-weight:800;width:16px;}

  .wheel-row{margin-bottom:14px;}
  .wheel-label{font-size:13.5px;margin-bottom:4px;color:var(--ink);}
  .wheel-label b{color:var(--c-violet);}
  input[type=range]{width:100%;accent-color:var(--c-violet);}

  .chakra-card{background:var(--card-solid);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;}
  .chakra-card summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .chakra-card summary::-webkit-details-marker{display:none;}
  .chakra-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .chakra-card p{font-size:13.5px;margin:8px 0 0;color:var(--ink-soft);}

  .mood-row{display:flex;gap:10px;}
  .mood-btn{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;font-size:22px;
    width:48px;height:48px;cursor:pointer;transition:transform .15s;}
  .mood-btn:active{transform:scale(0.94);}
  .mood-btn.active{border-color:var(--c-gold);background:rgba(242,184,75,0.18);}
  .journal-entry{background:var(--card-solid);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;color:var(--ink);}
  .je-head{color:var(--c-violet);margin-bottom:6px;font-size:13px;font-weight:800;}

/* ===================== UTILS ===================== */

function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function formatDate(s){
  const parts = s.split('-');
  return parts[2]+'.'+parts[1];
}
function formatTime(sec){
  sec = Math.max(0,sec);
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return pad(m)+':'+pad(s);
}
function pluralDays(n){
  const mod10=n%10, mod100=n%100;
  if(mod100>=11 && mod100<=14) return 'дней';
  if(mod10===1) return 'день';
  if(mod10>=2 && mod10<=4) return 'дня';
  return 'дней';
}
function hashCode(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h=(h<<5)-h+str.charCodeAt(i); h|=0; }
  return Math.abs(h);
}
function pickDailyAffirmation(){
  const all=[];
  Object.values(AFFIRMATIONS).forEach(c=>all.push(...c.items));
  return all[hashCode(todayStr())%all.length];
}
function markActivity(){
  const today = todayStr();
  if(STATE.lastActiveDate === today) return;
  if(STATE.lastActiveDate === yesterdayStr()){ STATE.streak++; }
  else { STATE.streak = 1; }
  STATE.lastActiveDate = today;
}
function val(id){ const el=document.getElementById(id); return el? el.value : ''; }
function heroSceneForNow(){
  const h = new Date().getHours();
  if(h>=5 && h<11) return 'scene-sunrise';
  if(h>=11 && h<17) return 'scene-golden';
  if(h>=17 && h<21) return 'scene-bloom';
  return 'scene-night';
}
function buildGrainTexture(){
  try{
    const c = document.createElement('canvas');
    c.width = 96; c.height = 96;
    const ctx = c.getContext('2d');
    const imgData = ctx.createImageData(96,96);
    for(let i=0;i<imgData.data.length;i+=4){
      const v = Math.floor(Math.random()*255);
      imgData.data[i]=v; imgData.data[i+1]=v; imgData.data[i+2]=v; imgData.data[i+3]=255;
    }
    ctx.putImageData(imgData,0,0);
    document.documentElement.style.setProperty('--grain-tex', `url(${c.toDataURL()})`);
  }catch(e){}
}

let currentBreath=null, breathTimer=null, breathPlaying=false, breathRound=0, breathRoundsTotal=6, phaseIndex=0, phaseTimeLeft=0;
const PHASE_NAMES=['Вдох','Задержка','Выдох','Задержка'];
function openBreathing(id){
  currentBreath = BREATHING.find(b=>b.id===id);
  clearInterval(breathTimer);

    <div class="breath-phase-label" id="breath-phase-label">Готов(а)?</div>
    <div class="ring-wrap">
      <div class="ring" id="breath-ring" style="--pct:0"></div>
      <div class="ring-inner"><div class="breath-circle" id="breath-circle"></div></div>
    </div>
    <button class="med-play-btn standalone" id="breath-play-btn" onclick="toggleBreathPlay()">▶</button>
    <button class="link-btn center-link" onclick="finishBreathing()">Завершить</button>
  `;
}
function setBreathRounds(r){
  if(breathPlaying) return;
  breathRoundsTotal=r;
  renderBreathingSessionUI();
}
function toggleBreathPlay(){ breathPlaying ? pauseBreath() : startBreath(); }
function getPhaseDuration(i){ return currentBreath.pattern[i]; }
function nextPhaseIndex(i){
  let n=(i+1)%4, guard=0;
  while(getPhaseDuration(n)===0 && guard<4){ n=(n+1)%4; guard++; }
  return n;
}
function startBreath(){
  breathPlaying=true;
  document.getElementById('breath-play-btn').textContent='❚❚';
  if(phaseTimeLeft<=0){ phaseTimeLeft=getPhaseDuration(phaseIndex); }
  animateCirclePhase();
  updateBreathUI();
  breathTimer = setInterval(()=>{
    phaseTimeLeft--;
    if(phaseTimeLeft<=0){
      phaseIndex = nextPhaseIndex(phaseIndex);
      if(phaseIndex===0){
        breathRound++;
        if(breathRound>=breathRoundsTotal){ finishBreathing(); return; }
      }
      phaseTimeLeft = getPhaseDuration(phaseIndex);
      animateCirclePhase();
    }
    updateBreathUI();
  },1000);
}
function pauseBreath(){
  breathPlaying=false; clearInterval(breathTimer);
  const btn=document.getElementById('breath-play-btn');
  if(btn) btn.textContent='▶';
}
function animateCirclePhase(){
  const circle=document.getElementById('breath-circle');
  if(!circle) return;
  const dur=Math.max(getPhaseDuration(phaseIndex),1);
  circle.style.transition=`transform ${dur}s linear`;
  if(phaseIndex===0){ circle.style.transform='scale(1.7)'; }
  else if(phaseIndex===2){ circle.style.transform='scale(0.65)'; }
  const label=document.getElementById('breath-phase-label');
  if(label) label.textContent = PHASE_NAMES[phaseIndex];
}
function updateBreathUI(){
  const roundEl=document.getElementById('breath-round-badge');
  if(roundEl) roundEl.textContent = `${Math.min(breathRound,breathRoundsTotal)}/${breathRoundsTotal}`;
  const ringEl=document.getElementById('breath-ring');
  if(ringEl) ringEl.style.setProperty('--pct', (breathRound/breathRoundsTotal*100).toFixed(1));
}
function finishBreathing(){
  clearInterval(breathTimer); breathPlaying=false;
  STATE.totalBreathing++;
  markActivity(); saveState();
  alert('Дыхательная практика завершена 🌬');
  closeBreathingSession();
}
function closeBreathingSession(){
  clearInterval(breathTimer); breathPlaying=false; phaseTimeLeft=0;
  goBack();
}

function setAffirmCategory(k){
  currentAffirmCategory=k;
  currentAffirmIndex = hashCode(todayStr()+k) % (AFFIRMATIONS[k]? AFFIRMATIONS[k].items.length : 1);

function shuffleAffirmation(){
  const len = AFFIRMATIONS[currentAffirmCategory].items.length;

  currentAffirmIndex = next;

function toggleFavorite(cat, idx){
  const key = cat+'|'+idx;
  const i = STATE.favorites.indexOf(key);

}

  } else if(p.type==='intention'){
    html += renderIntention();
  } else if(p.type==='meditation-link'){
    html += `<button class="btn btn-primary" onclick="openMeditation('${p.meditationId}')">Начать медитацию</button>`;
  }
  el.innerHTML = html;
}
function completePractice(){
  const key = practiceKey();
  STATE.practiceCompletions[key] = (STATE.practiceCompletions[key]||0)+1;
  markActivity(); saveState();
  alert('Готово! Ты молодец 🌟');
}
function saveJournalPractice(n){
  const answers=[];
  for(let i=0;i<n;i++) answers.push(val('pj-'+i));
  const key = practiceKey();
  if(!STATE.practiceJournals[key]) STATE.practiceJournals[key]=[];
  STATE.practiceJournals[key].unshift({date:todayStr(), answers});
  markActivity(); saveState();
  alert('Сохранено 📓');
  renderPracticeDetail();
}
function renderJournalPracticeHistory(){
  const key = practiceKey();
  const entries = STATE.practiceJournals[key]||[];
  if(!entries.length) return '';
  return '<div class="section-sub">История</div>' + entries.slice(0,5).map(e=>`
    <div class="journal-entry"><div class="je-head">${formatDate(e.date)}</div>${e.answers.filter(Boolean).map(a=>`<p>${a}</p>`).join('')}</div>
  `).join('');
}
function renderChallenge21(){
  const c = STATE.challenge21;
  const pct = Math.round(c.checkedDays.length/21*100);
  const items = MONEY_CHALLENGE_TASKS.map((t,i)=>{
    const done = c.checkedDays.includes(i);
    return `<div class="challenge-item ${done?'done':''}" onclick="toggleChallengeDay(${i})"><span class="day-num">День ${i+1}</span><span class="day-task">${t}</span><span class="check">${done?'✓':''}</span></div>`;
  }).join('');
  return `
    <div class="ring-wrap">
      <div class="ring" style="--pct:${pct}"></div>
      <div class="ring-inner"><div class="ring-value">${c.checkedDays.length}/21</div><div class="ring-label">дней пройдено</div></div>
    </div>
    <div class="challenge-grid">${items}</div>`;
}
function toggleChallengeDay(i){
  const idx = STATE.challenge21.checkedDays.indexOf(i);
  if(idx>-1) STATE.challenge21.checkedDays.splice(idx,1); else STATE.challenge21.checkedDays.push(i);
  if(!STATE.challenge21.startedAt) STATE.challenge21.startedAt = todayStr();
  markActivity(); saveState();
  renderPracticeDetail();
}
function renderWheel(){
  const current = (STATE.wheelOfLife && STATE.wheelOfLife.values) || {};
  const rows = WHEEL_AREAS.map(a=>{
    const slug = a.replace(/\s+/g,'_');
    const v = current[a]!==undefined ? current[a] : 5;
    return `<div class="wheel-row"><div class="wheel-label">${a} <b id="wv-${slug}">${v}</b></div><input type="range" min="0" max="10" value="${v}" oninput="document.getElementById('wv-${slug}').textContent=this.value" id="wheel-${slug}"></div>`;
  }).join('');
  const note = (STATE.wheelOfLife && STATE.wheelOfLife.note) || '';
  return `<div class="wheel-list">${rows}</div><div class="field"><label>Какая сфера сейчас нуждается в внимании и почему?</label><textarea id="wheel-note">${note}</textarea></div><button class="btn btn-primary" onclick="saveWheel()">Сохранить</button>`;
}
function saveWheel(){
  const values={};
  WHEEL_AREAS.forEach(a=>{ const slug=a.replace(/\s+/g,'_'); values[a]=Number(val('wheel-'+slug)); });
  STATE.wheelOfLife = {date: todayStr(), values, note: val('wheel-note')};
  markActivity(); saveState();
  alert('Сохранено!');
}
function renderValues(){
  const selected = STATE.values.selected || [];
  const chips = VALUES_LIST.map(v=>`<button class="chip ${selected.includes(v)?'chip-active':''}" onclick="toggleValue('${v}')">${v}</button>`).join('');
  return `<p>Выбери до 5 главных ценностей:</p><div class="chip-grid">${chips}</div><div class="field"><label>Как ты можешь жить в большем согласии с этими ценностями?</label><textarea id="values-note">${STATE.values.note||''}</textarea></div><button class="btn btn-primary" onclick="saveValuesNote()">Сохранить</button>`;
}
function toggleValue(v){
  const sel = STATE.values.selected;
  const idx = sel.indexOf(v);
  if(idx>-1){ sel.splice(idx,1); }
  else { if(sel.length>=5){ alert('Можно выбрать не более 5 ценностей'); return; } sel.push(v); }
  saveState(); renderPracticeDetail();
}
function saveValuesNote(){
  STATE.values.note = val('values-note');
  markActivity(); saveState();
  alert('Сохранено!');
}
function renderChakras(){
  return CHAKRAS.map(c=>`<details class="chakra-card" style="border-left:4px solid ${c.color}"><summary><span class="chakra-dot" style="background:${c.color}"></span> ${c.name} — ${c.ru}</summary><p><b>Расположение:</b> ${c.location}</p><p><b>Тема:</b> ${c.theme}</p><p><b>Аффирмация:</b> «${c.affirmation}»</p><p><b>Практика:</b> ${c.practice}</p></details>`).join('')
    + `<button class="btn btn-primary" onclick="openMeditation('m8')">Медитация по чакрам</button>`;
}
function renderIntention(){
  const today = todayStr();
  const current = (STATE.intention.date===today) ? STATE.intention.text : '';
  const chips = INTENTION_SUGGESTIONS.map(s=>`<button class="chip" onclick="setIntentionText(this)" data-text="${s}">${s}</button>`).join('');
  return `<div class="chip-grid">${chips}</div><div class="field"><label>Моё намерение на сегодня</label><textarea id="intention-text">${current}</textarea></div><button class="btn btn-primary" onclick="saveIntention()">Сохранить намерение</button>`;
}
function setIntentionText(btn){
  document.getElementById('intention-text').value = btn.getAttribute('data-text');
}
function saveIntention(){
  STATE.intention = {date: todayStr(), text: val('intention-text')};
  markActivity(); saveState();
  alert('Намерение установлено на сегодня 🌙');
}

/* ===================== PLAN ===================== */

let wizardSelected=[], wizardTime='';
function renderPlanScreen(){
  const el = document.getElementById('plan-body');
  el.innerHTML = STATE.plan ? renderPlanView() : renderPlanWizard();
}
function renderPlanWizard(){
  const areas = Object.keys(AREA_CONFIG);
  const chips = areas.map(k=>`<button class="chip ${wizardSelected.includes(k)?'chip-active':''}" onclick="toggleWizardArea('${k}')">${AREA_CONFIG[k].icon} ${AREA_CONFIG[k].label}</button>`).join('');
  const timeChips = ['5-10 мин','15-20 мин','30+ мин'].map(t=>`<button class="chip ${wizardTime===t?'chip-active':''}" onclick="setWizardTime('${t}')">${t}</button>`).join('');
  return `
    <h3>Выбери, над чем хочешь работать</h3>
    <div class="chip-grid">${chips}</div>
    <div class="section-sub">Сколько времени готов(а) уделять в день?</div>
    <div class="chip-grid">${timeChips}</div>
    <button class="btn btn-primary" onclick="generatePlan()">Составить план на неделю</button>
  `;
}
function toggleWizardArea(k){
  const i = wizardSelected.indexOf(k);
  if(i>-1) wizardSelected.splice(i,1); else wizardSelected.push(k);
  renderPlanScreen();
}
function setWizardTime(t){ wizardTime=t; renderPlanScreen(); }
function generatePlan(){
  if(!wizardSelected.length){ alert('Выбери хотя бы одну сферу для работы'); return; }
  if(!wizardTime){ alert('Выбери, сколько времени готов(а) уделять в день'); return; }
  const days = WEEKDAYS.map((wd,i)=>{
    const areaKey = wizardSelected[i % wizardSelected.length];
    return { weekday: wd, area: areaKey, tasks:{
      meditation:{done:false}, breathing:{done:false}, affirmation:{done:false}, practice:{done:false}
    }};
  });
  STATE.plan = { areas: wizardSelected.slice(), timeCommitment: wizardTime, createdAt: todayStr(), days };
  markActivity(); saveState();
  renderPlanScreen();
}
const PLAN_TASK_LABELS = {meditation:'Медитация', breathing:'Дыхание', affirmation:'Аффирмация', practice:'Практика'};
function renderPlanView(){
  const plan = STATE.plan;
  let doneCount=0, totalCount=0;
  const daysHtml = plan.days.map((d,di)=>{
    const cfg = AREA_CONFIG[d.area];
    const taskRows = Object.entries(d.tasks).map(([key,t])=>{
      totalCount++; if(t.done) doneCount++;
      return `<div class="plan-task ${t.done?'done':''}">
        <label><input type="checkbox" ${t.done?'checked':''} onchange="togglePlanTask(${di},'${key}')"> ${PLAN_TASK_LABELS[key]}</label>
        <button class="link-btn" onclick="openPlanTask(${di},'${key}')">Открыть →</button>
      </div>`;
    }).join('');
    return `<details class="plan-day" ${di===0?'open':''}><summary>${d.weekday} — ${cfg.icon} ${cfg.label}</summary>${taskRows}</details>`;
  }).join('');
  const pct = totalCount? Math.round(doneCount/totalCount*100):0;
  return `
    <div class="ring-wrap">
      <div class="ring" style="--pct:${pct}"></div>
      <div class="ring-inner"><div class="ring-value">${pct}%</div><div class="ring-label">за неделю</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><b>${doneCount}</b><span>Выполнено</span></div>
      <div class="stat"><b>${totalCount-doneCount}</b><span>Осталось</span></div>
      <div class="stat"><b>${totalCount}</b><span>Всего</span></div>
    </div>
    <div class="section-sub">Дни недели</div>
    ${daysHtml}
    <button class="btn btn-outline" onclick="resetPlan()">Составить новый план</button>
  `;
}
function togglePlanTask(di,key){
  const t = STATE.plan.days[di].tasks[key];
  t.done = !t.done;
  if(t.done) markActivity();
  saveState();
  renderPlanScreen();
}
function openPlanTask(di,key){
  const d = STATE.plan.days[di];
  const cfg = AREA_CONFIG[d.area];
  if(key==='meditation') openMeditation(cfg.meditation);
  else if(key==='breathing') openBreathing(cfg.breathing);
  else if(key==='affirmation'){ currentAffirmCategory=cfg.affirm; currentAffirmIndex=0; goTo('screen-affirmations'); }
  else if(key==='practice'){ goToPractice(cfg.practiceCat, cfg.practiceId); }
}
function resetPlan(){
  if(confirm('Составить новый план вместо текущего?')){
    STATE.plan=null; wizardSelected=[]; wizardTime='';
    saveState();
    renderPlanScreen();
  }
}

/* ===================== JOURNAL ===================== */

function renderJournal(){
  const el = document.getElementById('journal-body');
  const moods=['😊','🙂','😐','😔','😢'];
  el.innerHTML = `
    <div class="field"><label>Настроение сегодня</label><div class="mood-row">${moods.map(m=>`<button class="mood-btn ${STATE.todayMood===m?'active':''}" onclick="setMood('${m}')">${m}</button>`).join('')}</div></div>
    <div class="field"><label>3 вещи, за которые я благодарен(на)</label>
      <input type="text" id="j-g1" placeholder="1...">
      <input type="text" id="j-g2" placeholder="2..." style="margin-top:8px;">
      <input type="text" id="j-g3" placeholder="3..." style="margin-top:8px;">
    </div>
    <div class="field"><label>Что получилось сегодня?</label><textarea id="j-win"></textarea></div>
    <div class="field"><label>Чему я научился(лась)?</label><textarea id="j-lesson"></textarea></div>
    <button class="btn btn-primary" onclick="saveJournalEntry()">Сохранить запись</button>
    <div class="section-sub">История</div>
    <div id="journal-history">${renderJournalEntries()}</div>
  `;
}
function setMood(m){ STATE.todayMood=m; saveState(); renderJournal(); }
function saveJournalEntry(){
  const entry = {
    date: todayStr(), mood: STATE.todayMood||'🙂',
    gratitude:[val('j-g1'),val('j-g2'),val('j-g3')].filter(Boolean),
    win: val('j-win'), lesson: val('j-lesson')
  };
  STATE.journalEntries.unshift(entry);
  STATE.totalJournal++;
  markActivity(); saveState();
  alert('Запись сохранена 📖');
  renderJournal();
}
function renderJournalEntries(){
  if(!STATE.journalEntries.length) return '<p class="empty-hint">Пока нет записей — начни сегодня.</p>';
  return STATE.journalEntries.slice(0,10).map(e=>`
    <div class="journal-entry"><div class="je-head">${e.mood} ${formatDate(e.date)}</div>
      ${e.win?`<p><b>Победа:</b> ${e.win}</p>`:''}
      ${e.lesson?`<p><b>Урок:</b> ${e.lesson}</p>`:''}
      ${e.gratitude.length?`<p><b>Благодарность:</b> ${e.gratitude.join(', ')}</p>`:''}
    </div>`).join('');
}

/* ===================== PROFILE ===================== */

function renderProfile(){
  const el = document.getElementById('profile-body');
  el.innerHTML = `
    <div class="profile-header"><div class="avatar">🧘</div><input id="profile-name" value="${STATE.name}" onchange="updateName()"></div>
    <div class="card">
      <div class="stat-row" style="margin-top:0;padding-top:0;border-top:none;">
        <div class="stat"><b>${STATE.streak}🔥</b><span>${pluralDays(STATE.streak)}</span></div>
        <div class="stat"><b>${STATE.totalMeditations}</b><span>Медитаций</span></div>
        <div class="stat"><b>${STATE.totalBreathing}</b><span>Дыхания</span></div>
        <div class="stat"><b>${STATE.totalJournal}</b><span>Записей</span></div>
      </div>
    </div>
    <button class="btn btn-outline" onclick="resetAllData()">Сбросить весь прогресс</button>
  `;
}
function updateName(){ STATE.name = val('profile-name') || 'Друг'; saveState(); }
function resetAllData(){
  if(confirm('Точно сбросить весь прогресс? Это действие нельзя отменить.')){
    localStorage.removeItem(STORAGE_KEY);
    STATE = defaultState();
    wizardSelected=[]; wizardTime='';
    goHome();
  }
}

/* ===================== INIT ===================== */

document.addEventListener('DOMContentLoaded', ()=>{
  buildGrainTexture();
  loadState();
  if(STATE.plan) wizardSelected = STATE.plan.areas.slice();
  renderHome();
});
</script>
</body>
